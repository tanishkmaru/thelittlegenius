<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Genius</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXhW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"> 
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
</head>
<body>
    <div class="programs">
        <div class="consists">
            <h1> PROGRAMS </h1> <br>
            <p>At The Little Genius, we offer a comprehensive range of programs from Playgroup to Upper Kindergarten (UKG), designed to foster early childhood development through a structured and engaging learning environment.</p>
            <img src="C:\Users\admin\Downloads\programs.jpg" alt="Preschool Programs" class="program-image">
        </div>
    </div>

    <!-- Add GSAP Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        gsap.from(".consists", {
            duration: 1.5,
            opacity: 0,
            y: 50,
            ease: "power2.out"
        });

        gsap.from(".consists h1", {
            duration: 1.5,
            opacity: 0,
            x: -50,
            delay: 0.5,
            ease: "power2.out"
        });

        gsap.from(".consists p", {
            duration: 1.5,
            opacity: 0,
            x: 50,
            delay: 0.7,
            ease: "power2.out"
        });

        gsap.from(".program-image", {
            duration: 1.5,
            opacity: 0,
            scale: 0.8,
            delay: 1,
            ease: "power2.out"
        });
    });
</script>
</body>
</html>
