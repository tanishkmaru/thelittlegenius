<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Genius</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
<title>Online Registeration Form</title>
<div class = "reg">
<h1>Online Registeration Form</h1>
</div>
    <div class="container form-container">

        <form action="registration.php" method="post">
            
            <div class="row">
                <div class="col-md-4">
                    <label>Name of Child <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="cname" required>
                </div>
                <div class="col-md-4">
                    <label>Nick Name (if any)</label>
                    <input type="text" class="form-control" name="nickname">
                </div>
                <div class="col-md-4">
                    <label>Sex <span class="text-danger">*</span></label>
                    <select class="form-control" name="gender" required>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <label>DOB <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" name="dob" required>
                </div>
                <div class="col-md-4">
                    <label>Home Phone</label>
                    <input type="text" class="form-control" name="homephone">
                </div>
                <div class="col-md-4">
                    <label>Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <label>Child's Home Address <span class="text-danger">*</span></label>
                    <textarea class="form-control" name="address" rows="2" required></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <label>Town, State and Pincode <span class="text-danger">*</span></label>
                    <textarea class="form-control" name="town" rows="2" required></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <label>Father's Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="fname" required>
                </div>
                <div class="col-md-4">
                    <label>Occupation <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="father_occu" required>
                </div>
                <div class="col-md-4">
                    <label>Mobile <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="father_mobile" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <label>Mother's Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="mname" required>
                </div>
                <div class="col-md-4">
                    <label>Occupation</label>
                    <input type="text" class="form-control" name="mother_occu">
                </div>
                <div class="col-md-4">
                    <label>Mobile</label>
                    <input type="text" class="form-control" name="mother_mobile">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <label>Father's Education Qualification</label>
                    <input type="text" class="form-control" name="father_edu">
                </div>
                <div class="col-md-6">
                    <label>Mother's Education Qualification</label>
                    <input type="text" class="form-control" name="mother_edu">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <label>Mother Tongue <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="mother_tongue" required>
                </div>
            </div>

                <div class="row">
                    <div class="col-md-12">
                        <label>Does your child have any special problems or fear? <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="reason" rows="3" required></textarea>
                    </div>
                </div>

            <div class="row">
                <div class="col-md-12 text-center mt-4">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>

        </form>
    </div>

</body>
</html>
