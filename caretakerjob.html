<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Genius</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/Flip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/EasePack.min.js"></script>

</head>
<body>
    <h2>Care Taker Careers at The Little Genius</h2>

    <div class="container form-containn">


    <form action="apply.php" method="post" enctype="multipart/form-data">
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="qualification">Highest Qualification:</label>
        <input type="text" id="qualification" name="qualification" required>

        <label for="experience">Years of Experience:</label>
        <input type="number" id="experience" name="experience" min="0" required>

        <label for="resume">Upload Resume (PDF only):</label>
        <input type="file" id="resume" name="resume" accept=".pdf" required>

        <label for = "message"> Message</label>
        <input type="text" id="msg" name="message">

        <button type="submit">Apply Now</button>

    </form>
</div>

</body>
</html>
